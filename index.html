<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zimnat Finance Treasury</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #134B53;
    --paper: #FFFFFF;
    --paper-2: #F1F3F5;
    --rule: #E2E5E8;
    --rule-strong: #C7CCD1;
    --green: #00A950;
    --green-dark: #00893F;
    --blue: #008AD1;
    --muted: #5B6670;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(27,42,57,0.06), 0 1px 2px rgba(27,42,57,0.04);
    --shadow-md: 0 8px 24px rgba(27,42,57,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--navy);
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    background: linear-gradient(120deg, var(--green-dark), var(--green)); color: #fff; padding: 12px 24px;
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  .topbar img.logo { height: 24px; width: auto; display: block; filter: brightness(0) invert(1); }
  .topbar .divider { width: 1px; height: 22px; background: rgba(255,255,255,0.25); }
  .topbar .subtitle { font-family: 'Inter', sans-serif; font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase; color: #C3CCD2; }
  .topbar .spacer { flex: 1; }
  .topbar button.home-btn {
    font-family: 'Inter', sans-serif; font-size: 12.5px; padding: 6px 14px; border-radius: 999px;
    background: transparent; color: #D7DEE2; border: 1px solid rgba(255,255,255,0.25); cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: background .15s ease, color .15s ease;
  }
  .topbar button.home-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .topbar .current-app { font-family: 'Inter', sans-serif; font-size: 13px; color: #fff; font-weight: 500; }

  .launcher {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px; position: relative; overflow: hidden;
  }
  .launcher .bg-logo {
    position: absolute; right: -80px; top: 50%; transform: translateY(-50%);
    width: 640px; opacity: 0.05; pointer-events: none; z-index: 0;
  }
  .launcher .fg-logo { width: 210px; height: auto; margin-bottom: 26px; position: relative; z-index: 1; }
  .launcher h1 { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 6px; text-align: center; position: relative; z-index: 1; }
  .launcher .lede { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--muted); text-align: center; max-width: 480px; margin-bottom: 40px; position: relative; z-index: 1; }

  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; max-width: 780px; }
  .card {
    width: 320px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 26px; cursor: pointer;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--green); }
  .card .icon-badge {
    width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .card .icon-badge.a { background: rgba(0,169,80,0.12); color: var(--green-dark); }
  .card .icon-badge.b { background: rgba(0,138,209,0.12); color: var(--blue); }
  .card h2 { font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 18px; margin: 0 0 8px; }
  .card p { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 18px; }
  .card .enter-link { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--green-dark); display: flex; align-items: center; gap: 5px; }

  .app-frame-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  iframe.app-frame { width: 100%; border: none; flex: 1 1 auto; min-height: 0; }

  .hidden { display: none !important; }

  .gate-wrap {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .gate-card {
    width: 380px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--radius);
    box-shadow: var(--shadow-md); padding: 32px 30px;
  }
  .gate-card .fg-logo { width: 170px; height: auto; display: block; margin: 0 auto 22px; }
  .gate-card h2 { font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 18px; margin: 0 0 6px; text-align: center; }
  .gate-card p.hint { font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--muted); text-align: center; margin: 0 0 22px; }
  .gate-card label { display: block; font-family: 'Inter', sans-serif; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .gate-card input {
    width: 100%; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 13.5px;
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--paper);
    margin-bottom: 14px;
  }
  .gate-card input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(0,169,80,0.12); }
  .gate-card button.gate-submit {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 500; padding: 10px 14px;
    border-radius: 8px; background: var(--navy); color: #fff; border: 1px solid var(--navy); cursor: pointer;
  }
  .gate-card .gate-error { font-family: 'Inter', sans-serif; font-size: 12px; color: #C4453A; margin-top: 12px; text-align: center; }
  .gate-card .gate-checking { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
