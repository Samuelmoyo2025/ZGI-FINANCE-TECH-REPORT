<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zimnat Finance Treasury</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #134B53;
    --paper: #FFFFFF;
    --paper-2: #F1F3F5;
    --rule: #E2E5E8;
    --rule-strong: #C7CCD1;
    --green: #00A950;
    --green-dark: #00893F;
    --blue: #008AD1;
    --muted: #5B6670;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(27,42,57,0.06), 0 1px 2px rgba(27,42,57,0.04);
    --shadow-md: 0 8px 24px rgba(27,42,57,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--navy);
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    background: var(--navy); color: #fff; padding: 12px 24px;
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  .topbar img.logo { height: 24px; width: auto; display: block; filter: brightness(0) invert(1); }
  .topbar .divider { width: 1px; height: 22px; background: rgba(255,255,255,0.25); }
  .topbar .subtitle { font-family: 'Inter', sans-serif; font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase; color: #C3CCD2; }
  .topbar .spacer { flex: 1; }
  .topbar button.home-btn {
    font-family: 'Inter', sans-serif; font-size: 12.5px; padding: 6px 14px; border-radius: 999px;
    background: transparent; color: #D7DEE2; border: 1px solid rgba(255,255,255,0.25); cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: background .15s ease, color .15s ease;
  }
  .topbar button.home-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .topbar .current-app { font-family: 'Inter', sans-serif; font-size: 13px; color: #fff; font-weight: 500; }

  .launcher {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px; position: relative; overflow: hidden;
  }
  .launcher .bg-logo {
    position: absolute; right: -80px; top: 50%; transform: translateY(-50%);
    width: 640px; opacity: 0.05; pointer-events: none; z-index: 0;
  }
  .launcher .fg-logo { width: 210px; height: auto; margin-bottom: 26px; position: relative; z-index: 1; }
  .launcher h1 { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 6px; text-align: center; position: relative; z-index: 1; }
  .launcher .lede { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--muted); text-align: center; max-width: 480px; margin-bottom: 40px; position: relative; z-index: 1; }

  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; max-width: 780px; }
  .card {
    width: 320px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 26px; cursor: pointer;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--green); }
  .card .icon-badge {
    width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .card .icon-badge.a { background: rgba(0,169,80,0.12); color: var(--green-dark); }
  .card .icon-badge.b { background: rgba(0,138,209,0.12); color: var(--blue); }
  .card h2 { font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 18px; margin: 0 0 8px; }
  .card p { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 18px; }
  .card .enter-link { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--green-dark); display: flex; align-items: center; gap: 5px; }

  .app-frame-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  iframe.app-frame { width: 100%; border: none; flex: 1 1 auto; min-height: 0; }

  .hidden { display: none !important; }

  .gate-wrap {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .gate-card {
    width: 380px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--radius);
    box-shadow: var(--shadow-md); padding: 32px 30px;
  }
  .gate-card .fg-logo { width: 170px; height: auto; display: block; margin: 0 auto 22px; }
  .gate-card h2 { font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 18px; margin: 0 0 6px; text-align: center; }
  .gate-card p.hint { font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--muted); text-align: center; margin: 0 0 22px; }
  .gate-card label { display: block; font-family: 'Inter', sans-serif; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .gate-card input {
    width: 100%; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 13.5px;
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--paper);
    margin-bottom: 14px;
  }
  .gate-card input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(0,169,80,0.12); }
  .gate-card button.gate-submit {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 500; padding: 10px 14px;
    border-radius: 8px; background: var(--navy); color: #fff; border: 1px solid var(--navy); cursor: pointer;
  }
  .gate-card .gate-error { font-family: 'Inter', sans-serif; font-size: 12px; color: #C4453A; margin-top: 12px; text-align: center; }
  .gate-card .gate-checking { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>

<script>
function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const ICONS = {
  dashboard: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  treasury: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/></svg>',
  arrow: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>',
  home: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
};

const root = document.getElementById('root');
const frames = { dashboard: null, treasury: null };
let currentView = 'home';
const LOGO_SRC = 'data:image/png;base64,' + document.getElementById('zimnat-logo-b64').textContent.trim();

/* -------------------------------------------------------------- */
/* Auth gate — the whole launcher (including the two-card picker)  */
/* sits behind the same treasury sign-in, using the same Supabase   */
/* project/session already used inside Cash Position and Treasury.  */
/* -------------------------------------------------------------- */

const TREASURY_CONFIG_KEY = 'zimnat_treasury_supabase_config_v1';
let sb = null;
let currentUser = null;

function getTreasuryConfig() {
  try {
    const raw = localStorage.getItem(TREASURY_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveTreasuryConfig(url, key) {
  localStorage.setItem(TREASURY_CONFIG_KEY, JSON.stringify({ url, key }));
}
function getClient() {
  if (sb) return sb;
  const cfg = getTreasuryConfig();
  if (!cfg || !cfg.url || !cfg.key) return null;
  sb = supabase.createClient(cfg.url, cfg.key);
  return sb;
}

function renderGateShell(inner) {
  root.innerHTML =
    renderTopbar('home', true) +
    '<div class="gate-wrap"><div class="gate-card">' +
      '<img class="fg-logo" src="' + LOGO_SRC + '" alt="Zimnat General Insurance" />' +
      inner +
    '</div></div>';
}

function renderCheckingGate() {
  renderGateShell('<div class="gate-checking">Checking connection…</div>');
}

function renderConnectGate(error) {
  renderGateShell(
    '<h2>Connect to Finance Treasury</h2>' +
    '<p class="hint">Enter your Supabase project details (same as the treasury report) to sign in.</p>' +
    '<label>Supabase project URL</label>' +
    '<input id="gateUrl" type="text" placeholder="https://xxxxxxxx.supabase.co" />' +
    '<label>Publishable / anon key</label>' +
    '<input id="gateKey" type="text" placeholder="eyJhbGciOi..." />' +
    '<button class="gate-submit" id="gateConnectBtn">Connect</button>' +
    (error ? '<div class="gate-error">' + error + '</div>' : '')
  );
  document.getElementById('gateConnectBtn').addEventListener('click', handleGateConnect);
}

function renderSignInGate(error) {
  renderGateShell(
    '<h2>Sign in</h2>' +
    '<p class="hint">Sign in to access the Finance Treasury dashboard and reports.</p>' +
    '<label>Email</label>' +
    '<input id="gateEmail" type="email" placeholder="you@zimnat.co.zw" />' +
    '<label>Password</label>' +
    '<input id="gatePassword" type="password" placeholder="••••••••" />' +
    '<button class="gate-submit" id="gateSignInBtn">Sign in</button>' +
    (error ? '<div class="gate-error">' + error + '</div>' : '')
  );
  document.getElementById('gateSignInBtn').addEventListener('click', handleGateSignIn);
}

async function handleGateConnect() {
  const url = document.getElementById('gateUrl').value.trim();
  const key = document.getElementById('gateKey').value.trim();
  if (!url || !key) { renderConnectGate('Both fields are required.'); return; }
  try {
    sb = supabase.createClient(url, key);
    const { error } = await sb.auth.getSession();
    if (error) throw error;
    saveTreasuryConfig(url, key);
    renderSignInGate();
  } catch (e) {
    renderConnectGate('Could not reach that project — check the URL and key.');
  }
}

async function handleGateSignIn() {
  const email = document.getElementById('gateEmail').value.trim();
  const password = document.getElementById('gatePassword').value;
  const client = getClient();
  if (!client) { renderConnectGate(); return; }
  try {
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    const u = data.session.user;
    currentUser = { name: (u.user_metadata && u.user_metadata.full_name) || u.email, email: u.email };
    renderHome();
  } catch (e) {
    renderSignInGate('Sign-in failed — check email and password.');
  }
}

async function handleSignOut() {
  const client = getClient();
  if (client) { try { await client.auth.signOut(); } catch (e) {} }
  currentUser = null;
  currentView = 'home';
  frames.dashboard = null;
  frames.treasury = null;
  renderSignInGate();
}

async function initAuth() {
  renderCheckingGate();
  const cfg = getTreasuryConfig();
  if (!cfg) { renderConnectGate(); return; }
  const client = getClient();
  if (!client) { renderConnectGate(); return; }
  try {
    const { data } = await client.auth.getSession();
    if (data && data.session) {
      const u = data.session.user;
      currentUser = { name: (u.user_metadata && u.user_metadata.full_name) || u.email, email: u.email };
      renderHome();
    } else {
      renderSignInGate();
    }
  } catch (e) {
    renderConnectGate();
  }
}

function renderTopbar(view, isGate) {
  const label = view === 'dashboard' ? 'Finance Dashboard' : view === 'treasury' ? 'Treasury Report' : '';
  return (
    '<div class="topbar">' +
      '<img class="logo" src="' + LOGO_SRC + '" alt="Zimnat General Insurance" />' +
      '<span class="divider"></span>' +
      '<span class="subtitle">Finance Treasury</span>' +
      (view !== 'home' ? '<span class="divider"></span><span class="current-app">' + label + '</span>' : '') +
      '<span class="spacer"></span>' +
      (!isGate && currentUser ? '<span class="current-app" style="margin-right:8px;">' + currentUser.name + '</span>' : '') +
      (view !== 'home' ? '<button class="home-btn" id="btnHome">' + ICONS.home + ' Home</button>' : '') +
      (!isGate ? '<button class="home-btn" id="btnSignOut" style="margin-left:8px;">Sign out</button>' : '') +
    '</div>'
  );
}

function renderHome() {
  root.innerHTML =
    renderTopbar('home') +
    '<div class="launcher">' +
      '<img class="bg-logo" src="' + LOGO_SRC + '" alt="" />' +
      '<img class="fg-logo" src="' + LOGO_SRC + '" alt="Zimnat General Insurance" />' +
      '<h1>Finance Treasury</h1>' +
      '<div class="lede">Two tools, one place — the finance dashboard for payments, debtors and RI receivables, and the daily treasury liquidity report.</div>' +
      '<div class="cards">' +
        '<div class="card" id="cardDashboard">' +
          '<div class="icon-badge a">' + ICONS.dashboard + '</div>' +
          '<h2>Finance Dashboard</h2>' +
          '<p>Cash position, payments, debtors, and RI receivables — upload exports and browse each as its own dashboard.</p>' +
          '<div class="enter-link">Open dashboard ' + ICONS.arrow + '</div>' +
        '</div>' +
        '<div class="card" id="cardTreasury">' +
          '<div class="icon-badge b">' + ICONS.treasury + '</div>' +
          '<h2>Treasury Report</h2>' +
          '<p>The daily liquidity report — banks, commitments, cashflow, and checks, saved and shared with the team.</p>' +
          '<div class="enter-link">Open treasury report ' + ICONS.arrow + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById('cardDashboard').addEventListener('click', () => showApp('dashboard'));
  document.getElementById('cardTreasury').addEventListener('click', () => showApp('treasury'));
  document.getElementById('btnSignOut').addEventListener('click', handleSignOut);
}

function showApp(view) {
  currentView = view;
  root.innerHTML = renderTopbar(view) + '<div class="app-frame-wrap" id="frameWrap"></div>';
  document.getElementById('btnHome').addEventListener('click', () => { currentView = 'home'; renderHome(); });
  document.getElementById('btnSignOut').addEventListener('click', handleSignOut);

  const wrap = document.getElementById('frameWrap');
  if (!frames[view]) {
    const iframe = document.createElement('iframe');
    iframe.className = 'app-frame';
    const b64 = document.getElementById(view === 'dashboard' ? 'dashboard-src-b64' : 'treasury-src-b64').textContent.trim();
    iframe.srcdoc = b64ToUtf8(b64);
    frames[view] = iframe;
  }
  wrap.appendChild(frames[view]);
}

initAuth();
</script>
</body>
</html>
